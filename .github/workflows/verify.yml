name: Verify C.A.S.E. Boundary

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node package
        run: npm install

      - name: Install Python test package
        run: python -m pip install -r requirements.txt

      - name: Verify release and proof suite
        run: npm run verify

      - name: Run Python tests
        run: pytest

      - name: Run tamper-fail test
        run: npm run tamper:test
