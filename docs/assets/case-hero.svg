    <path d="M-15 -20 H15 V16 H-15 Z" fill="none" stroke="#7E9487" stroke-width="3"/>
    <path d="M-8 -8 H8 M-8 4 H8" stroke="#7E9487" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 16 h14 l-7 8z" fill="#7E9487"/>
