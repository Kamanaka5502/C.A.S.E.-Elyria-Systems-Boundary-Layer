    <path d="M0 -18 V18 M-18 0 H18" fill="none" stroke="#7E9487" stroke-width="3"/>
    <path d="M0 -18 v-10 M0 18 v10 M-18 0 h-10 M18 0 h10" fill="none" stroke="#7E9487" stroke-width="3" stroke-linecap="round"/>
