<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">C.A.S.E. Elyria Systems Boundary Layer</title>
  <desc id="desc">Commit-time admissibility, attestation, receipt, replay, and lineage verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F7F4EE"/>
      <stop offset="100%" stop-color="#F2EFE7"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F6DE9D"/>
      <stop offset="100%" stop-color="#C9A15B"/>
    </linearGradient>
    <linearGradient id="sageWave" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#9BB2A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7E9487" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F1D33" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .navy { fill: #0F1D33; }
      .gold { fill: #C9A15B; }
      .sage { fill: #7E9487; }
      .line { stroke: #D9C79A; stroke-width: 2; }
      .thin { stroke: #D9C79A; stroke-width: 1.1; stroke-dasharray: 3 6; }
      .wave { fill: none; stroke: url(#sageWave); stroke-width: 3; }
      .title { font: 700 72px Georgia, 'Times New Roman', serif; letter-spacing: 0.5px; }
      .subtitle { font: italic 32px Georgia, 'Times New Roman', serif; }
      .label { font: 600 20px Arial, Helvetica, sans-serif; letter-spacing: 3px; }
      .process { font: 600 15px Georgia, 'Times New Roman', serif; }
      .smallcaps { font: 600 14px Arial, Helvetica, sans-serif; letter-spacing: 4px; }
      .quote { font: 600 22px Georgia, 'Times New Roman', serif; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="url(#bg)"/>

  <path class="wave" d="M1210,180 C1300,110 1420,120 1600,155"/>
  <path class="wave" d="M1180,210 C1300,145 1430,150 1600,190"/>
  <path class="wave" d="M1160,242 C1300,180 1450,190 1600,225"/>
  <path class="wave" d="M1110,820 C1275,785 1435,800 1600,865"/>
  <path class="wave" d="M1090,850 C1285,815 1455,830 1600,895"/>

  <g transform="translate(65,62)">
    <circle cx="36" cy="36" r="36" fill="none" stroke="#C9A15B" stroke-width="2.2"/>
    <path d="M18 63 C28 56, 34 34, 36 21 C38 34, 44 56, 54 63" fill="none" stroke="#C9A15B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M10 63 H62" stroke="#C9A15B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 8 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#C9A15B"/>
  </g>

  <text x="175" y="150" class="title navy">C.A.S.E. Elyria</text>
  <text x="52" y="255" class="title navy">Systems Boundary Layer</text>
  <line x1="52" y1="310" x2="630" y2="310" class="line"/>
  <rect x="358" y="304" width="10" height="10" transform="rotate(45 363 309)" fill="#C9A15B"/>
  <text x="54" y="370" class="subtitle navy">Commit-time admissibility, attestation,</text>
  <text x="54" y="420" class="subtitle navy">receipt, replay, and lineage verification</text>

  <g transform="translate(1165,380)">
