  <line x1="46" y1="925" x2="1554" y2="925" class="line"/>
  <rect x="798" y="920" width="10" height="10" transform="rotate(45 803 925)" fill="#C9A15B"/>

  <g transform="translate(50,954)">
    <text x="76" y="16" class="label navy" font-size="28">C.A.S.E.</text>
    <text x="270" y="8" class="smallcaps navy" font-size="12">CENTER FOR ADVANCED</text>
